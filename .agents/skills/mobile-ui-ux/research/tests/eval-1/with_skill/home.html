 kh:i=>`Class ${['7B','8A','9C'][i]} today`,lh:()=>"Today's classes",la:'Timetable',cl:'Class'}}[st.role]);
/* Templates */
const pill=([k,ic,t])=>`<span class="pill ${k}">${I(ic)}${esc(t)}</span>`;
const btn=a=>`<a class="btn ${a.k}" href="#${a.k=='filled'?'do':'act'}"${a.on&&!st.on?' aria-disabled="true"':''}>${esc(a.l)}</a>`;
const row=x=>`<li class="row">${I(x.ic,'lead')}<div><a class="stretch" href="${x.href||'#activity'}">${esc(x.t)}</a><p class="muted">${esc(x.m)}</p>${x.p?pill(x.p):''}${x.a?`<div class="act">${btn(x.a)}${x.a.on&&!st.on?'<p class="muted">Payments need a connection.</p>':''}</div>`:''}</div>${I('chev','go')}</li>`;
const spark=a=>{const mn=Math.min(...a),mx=Math.max(...a),p=a.map((v,i)=>[(2+i*84/(a.length-1)).toFixed(1),(38-(v-mn)/(mx-mn||1)*34).toFixed(1)]),e=p.at(-1);return `<svg class="sp" viewBox="0 0 88 40" aria-hidden="true" focusable="false"><polyline points="${p.join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/><circle cx="${e[0]}" cy="${e[1]}" r="3" fill="var(--accent)"/></svg>`};
const wk=i=>dsh.format(monday(6-i));
const R={attn:d=>`<ul class="card list" role="list">${d.attn.map(row).join('')}</ul>`,
 kpi:d=>d.kpi[st.ctx].map(k=>`<a class="tile card" href="${k.href}"><span class="muted">${esc(k.l)}</span><span class="v num">${esc(k.v)}</span><span class="muted">${esc(k.m)}</span>${k.d?`<span class="dl">${I(k.d[0],'s')}${esc(k.d[1])}</span>`:''}${k.p?pill(k.p):''}${k.sp?spark(k.sp):''}${k.bar!=null?`<span class="meter" aria-hidden="true"><i style="width:${k.bar}%"></i></span>`:''}</a>`).join(''),
 chart:d=>{const c=d.chart[st.ctx],t=i=>`Week of ${wk(i)}: ${c.ft(c.a[i])}${c.n[i]?' · '+c.n[i]:''}`;
  return `<div class="card chart"><strong>${esc(c.sub)}</strong><div class="bars" role="group" aria-label="${esc(c.sub)}, last 6 weeks. Select a week for details.">${c.a.map((v,i)=>`<button class="bar" data-t="${esc(t(i))}" aria-pressed="${i==st.sel}" aria-label="${esc(t(i))}"><span class="num">${c.f(v)}</span><span class="col"><i style="height:${Math.max(v/c.max*100,2)}%"></i></span><span class="lab">${wk(i)}</span></button>`).join('')}</div><p class="readout" role="status">${esc(t(st.sel))}</p><details><summary>View data table</summary><table><caption class="sr">${esc(c.sub)}</caption><thead><tr><th scope="col">Week of</th><th scope="col" style="text-align:right">${esc(c.col)}</th></tr></thead><tbody>${c.a.map((v,i)=>`<tr><th scope="row">${wk(i)}</th><td class="num">${c.ft(v)}</td></tr>`).join('')}</tbody></table></details></div>`},
 list:d=>`<ul class="card list" role="list">${(d.list[st.ctx]||d.list[0]).map(row).join('')}</ul>`};
const sk=(w,h)=>`<span class="sk" style="width:${w};height:${h}px"></span>`,skr=n=>`<div class="card list">${'<div class="row">'.repeat(0)}${Array(n).fill(`<div class="row">${sk('24px',24)}<div class="skc">${sk('70%',20)}${sk('50%',14)}${sk('30%',20)}</div></div>`).join('')}</div>`;
const SK={attn:()=>skr(3),list:()=>skr(3),kpi:()=>Array(3).fill(`<div class="tile card"><div class="skc">${sk('40%',14)}${sk('55%',28)}${sk('75%',14)}</div></div>`).join(''),chart:()=>`<div class="card chart" style="min-height:19rem"><div class="skc">${sk('50%',16)}${sk('100%',150)}</div></div>`};
const box=(ic,t,b,a='',role='status')=>`<div class="card state" role="${role}">${I(ic)}<div><strong>${esc(t)}</strong><p class="muted">${esc(b)}</p>${a}</div></div>`;
const retry=r=>`<button class="btn tonal" data-retry="${r}">Retry</button>`;
const ERR={timeout:r=>box('clock',`Loading ${NM[r]} is taking too long`,'Check your connection, then try again. Nothing else on this screen is affected.',retry(r),'alert'),5:r=>box('alert',`Couldn't load ${NM[r]}`,'This is a problem on our side, not with your data. Try again in a moment.',retry(r),'alert')};
const EMPTY={attn:()=>box('check',"You're all caught up",'New items that need you will appear here.'),kpi:()=>box('cal','No attendance or grades yet','They appear here after the first week of the new term.','<a class="btn tonal" href="#last-term">View last term</a>'),chart:()=>box('cal','Trend starts in week 2','We need a full week of records before showing a chart.'),list:()=>box('chat','No recent activity','Grades, absences and notices will be listed here.')};
const isEmpty=(r,d)=>r=='attn'?!d.attn.length:st.sc=='newterm'&&r!='attn';
/* Data region state machine: load -> ready | empty | err(timeout, 5xx). Skeleton after 0 ms on first load only; refresh keeps content. Exits at 10 s. */
function api(r){const sc=st.sc,d=build(sc=='longtext');if(sc=='loading')return new Promise(()=>{});
 if(sc=='error'&&(r=='kpi'||r=='chart')&&st.fail[r]-->0)return Promise.reject({status:503});if(sc=='caughtup'&&r=='attn')d.attn=[];return Promise.resolve(d)}
function paint(r){const s=st.r[r],el=$('#'+r);if(!s)return;
 el.innerHTML=s.s=='load'?SK[r]()+(s.hint?'<p class="muted" role="status">Still loading…</p>':''):s.s=='err'?ERR[s.e](r):s.s=='empty'?EMPTY[r]():R[r](s.d);
 el.className=(r=='kpi'?'kpis ':'')+'rg '+s.s;el.setAttribute('aria-busy',s.s=='load');
 if(r=='attn')$('#an').textContent=s.s=='ready'?s.d.attn.length+' items':''}
async function load(r,quiet,focus){const q=quiet&&st.r[r]&&st.r[r].d,s=st.r[r]={s:q?'ready':'load',d:q?st.r[r].d:null},live=()=>st.r[r]===s&&s.s=='load';if(!q)paint(r);
 const t=[setTimeout(()=>{if(live()){s.hint=1;paint(r)}},6e3),setTimeout(()=>{if(live()){s.s='err';s.e='timeout';paint(r);done(r)}},1e4)];
 try{const d=(await Promise.all([api(r),sleep(q?200:450)]))[0];if(st.r[r]!==s||(!q&&s.s!='load'))return;s.d=d;s.s=isEmpty(r,d)?'empty':'ready'}catch(e){if(st.r[r]!==s)return;s.s='err';s.e=e.status>=500?5:'timeout'}
 t.forEach(clearTimeout);paint(r);done(r);if(focus)$('#'+r).focus({preventScroll:true})}
function done(r){if(pending.delete(r)&&!pending.size){const n=RG.filter(k=>st.r[k].s=='err').length;announce(n?`${n} section${n>1?'s':''} couldn't load.`:'Dashboard loaded.')}}
const announce=m=>{const l=$('#live');l.textContent='';setTimeout(()=>l.textContent=m,60)};
/* Chrome: nav, greeting, switcher, headings, banner, dev panel */
function chrome(){const d=build(0)[st.role]||build(0)[st.role],h=new Date().getHours();
 $('#nav').innerHTML='<ul>'+NAV[st.role].map(([ic,l],i)=>`<li><a href="#${l.toLowerCase()}"${i?'':' aria-current="page"'}><span class="ind">${I(ic)}</span>${l}</a></li>`).join('')+'</ul>';
 $('#hi').textContent=`Good ${h<12?'morning':h<18?'afternoon':'evening'}, ${d.who}`;$('#sub').textContent=`${dtf.format(new Date())} · Term 2, week 6`;
 $('#ctx').innerHTML=`<legend class="sr">${d.cl}</legend>`+d.ctx.map(([n,s],i)=>`<label><input type="radio" name="ctx" value="${i}"${i==st.ctx?' checked':''}><span>${esc(n)}<small>${esc(s)}</small></span></label>`).join('');
 $('#la').textContent=d.la+' ›'.slice(0,0);meta()}
function meta(){const d=build(st.sc=='longtext')[st.role];$('#h-k').textContent=d.kh(st.ctx);$('#h-l').textContent=d.lh(st.ctx);$('#la').setAttribute('aria-label',d.la+', '+d.lh(st.ctx));
 $('#upd').textContent='Updated '+ago(st.at);$('#rf').setAttribute('aria-label',`Updated ${ago(st.at)}. Refresh now`);
 $('#banner').hidden=st.on;$('#bt').textContent=`You're offline. Showing data saved ${ago(st.at)}.`;
 $('#dv').innerHTML='<p class="muted">Role</p>'+[['parent','Parent'],['teacher','Teacher']].map(([k,l])=>`<button class="btn line" data-role="${k}" aria-pressed="${st.role==k}">${l}</button>`).join('')+'<p class="muted">Data state</p>'+[['ready','Normal'],['loading','Loading (hangs, times out at 10 s)'],['caughtup','All caught up'],['newterm','New term, no data'],['error','Partial error (Retry works)'],['offline','Offline'],['longtext','Long text']].map(([k,l])=>`<button class="btn line" data-sc="${k}" aria-pressed="${st.sc==k}">${l}</button>`).join('')}
function start(){st.fail={kpi:1,chart:1};st.on=st.sc!='offline'&&navigator.onLine;st.at=Date.now()-(st.sc=='offline'?12:2)*6e4;st.ctx=0;st.sel=5;st.r={};pending.clear();RG.forEach(r=>pending.add(r));chrome();RG.forEach(r=>load(r));announce('Loading your dashboard')}
/* Events (delegated) */
document.addEventListener('click',async e=>{const t=e.target,b=t.closest('.bar'),rt=t.closest('[data-retry]'),sc=t.closest('[data-sc]'),ro=t.closest('[data-role]');
 if(t.closest('[aria-disabled=true]'))e.preventDefault();
 if(b){$$('.bar').forEach(x=>x.setAttribute('aria-pressed',x==b));st.sel=$$('.bar').indexOf(b);$('.readout').textContent=b.dataset.t}
 if(rt){pending.add(rt.dataset.retry);load(rt.dataset.retry,0,1)}
 if(sc||ro){if(sc)st.sc=sc.dataset.sc;else st.role=ro.dataset.role;history.replaceState(null,'',`?role=${st.role}&state=${st.sc}`);start()}});
$('#ctx').addEventListener('change',e=>{st.ctx=+e.target.value;st.sel=5;RG.slice(1).forEach(paint);meta()});
$('#rf').onclick=async()=>{if(!st.on)return announce(`You're offline. Showing data saved ${ago(st.at)}.`);const b=$('#rf');b.classList.add('busy');$('#upd').textContent='Refreshing…';
 await Promise.all(RG.map(r=>load(r,1)));st.at=Date.now();b.classList.remove('busy');meta();announce('Updated just now')};
$('#again').onclick=()=>{if(navigator.onLine&&st.sc!='offline'){st.on=true;meta();$('#rf').click()}else announce('Still offline. Showing saved data.')};
addEventListener('offline',()=>{st.on=false;meta();paint('attn')});addEventListener('online',()=>{st.on=true;meta();paint('attn');$('#rf').click()});
setInterval(()=>{if(!document.hidden)meta()},3e4);
/* PWA: install entry only after the 2nd visit and never in standalone; update/offline handled by sw.js (not included) */
let ip;try{localStorage.visits=(+localStorage.visits||0)+1}catch{}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e;try{if(+localStorage.visits>=2&&!matchMedia('(display-mode: standalone)').matches)$('#inst').hidden=false}catch{}});
$('#inst').onclick=async()=>{ip.prompt();await ip.userChoice;$('#inst').hidden=true};
if('serviceWorker'in navigator&&location.protocol=='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
start();
